name: Publish a Hugo site
description: Builds a Hugo website and deploys it to GitHub Pages (official Pages deployment).

inputs:
  access_token:
    description: "Token for accessing the theme components private repository"
    required: true

outputs:
  page_url:
    description: "URL of the deployed Pages site"
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    # see https://github.com/actions/checkout
    - name: Checkout sources
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.access_token }}
        submodules: true

    # see https://github.com/peaceiris/actions-hugo (dart-sass-version: checksum-verified install)
    - name: Setup Hugo and Dart Sass
      uses: peaceiris/actions-hugo@v3
      with:
        # renovate: datasource=github-releases depName=gohugoio/hugo extractVersion=^v(?<version>.+)$
        hugo-version: '0.170.1'
        # renovate: datasource=github-releases depName=sass/dart-sass
        dart-sass-version: '1.108.2'

    - name: Build
      run: |
        hugo version
        sass --version
        hugo --gc --minify
      shell: bash

    # see https://github.com/actions/upload-pages-artifact
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./public
        # e.g. .well-known/ (WKD on guite.de)
        include-hidden-files: true

    # see https://github.com/actions/deploy-pages
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
