name: Publish a Hugo site
description: Builds a Hugo website and deploys it into the gh-pages branch.

inputs:
  access_token:
    description: "Token for accessing the theme components private repository"
    required: true
  deploy_key:
    description: "SSH deploy key"
    required: true

runs:
  using: composite
  steps:
    # see https://github.com/actions/checkout
    - name: Checkout sources
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.access_token }}
        submodules: true

    # see https://github.com/peaceiris/actions-hugo
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        # renovate: datasource=github-releases depName=gohugoio/hugo extractVersion=^v(?<version>.+)$
        hugo-version: '0.170.0'

    # see https://gohugo.io/functions/css/sass/#dart-sass
    - name: Setup Dart Sass
      shell: bash
      env:
        # renovate: datasource=github-releases depName=sass/dart-sass
        DART_SASS_VERSION: 1.108.2
      run: |
        curl -fsSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" | tar -xz -C "${RUNNER_TEMP}"
        echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"

    - name: Build
      run: hugo --gc --minify
      shell: bash

    # see https://github.com/peaceiris/actions-gh-pages
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        deploy_key: ${{ inputs.deploy_key }}
        publish_branch: gh-pages
        publish_dir: ./public
